# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys OneBui as a static site (Vite SPA). Connect this repo to Render and
# it will pick up this file automatically, or use "New > Blueprint".
services:
  - type: web
    name: onebui
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Vite 8 / rolldown needs Node 20+, puppeteer (pa11y) needs Node 22.12+;
    # pin the build-time Node version.
    envVars:
      - key: NODE_VERSION
        value: "24.18.0"
    # SPA fallback: serve index.html for client-side routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
