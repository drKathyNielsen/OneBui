name: Accessibility

# Runs pa11y-ci (WCAG2AA) against the built app on every pull request, so
# accessibility regressions are caught as part of code review.
on:
  pull_request:
  workflow_dispatch:

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:a11y:ci builds with VITE_A11Y_FIXTURES=1 (a plain build omits the
      # fixture digests, and the fixture URLs would then canonicalize to a real
      # metro — checking the wrong page while reporting success), generates
      # .pa11yci.json from the digests present, and runs pa11y-ci against the
      # preview. No A11Y_TIER here: the PR run is the backstop and covers
      # everything, however the pre-push hook narrowed things locally.
      - name: Accessibility check (pa11y-ci)
        run: npm run test:a11y:ci
