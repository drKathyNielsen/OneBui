name: Accessibility

# Runs pa11y-ci (WCAG2AA) against the built app on every pull request, so
# accessibility regressions are caught as part of code review.
on:
  pull_request:
  workflow_dispatch:

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Accessibility check (pa11y-ci)
        run: npm run test:a11y
